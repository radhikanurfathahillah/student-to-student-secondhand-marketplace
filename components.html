<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contoh Komponen | Second.id</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .demo{padding:40px 10%}.demo h2{font:700 20px 'Manrope';margin:34px 0 14px}
    .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
    .swatch{width:80px;height:50px;border-radius:6px;border:1px solid #ddd;font-size:10px;padding:4px;display:flex;align-items:end}
    .field{display:block;font-size:12px;font-weight:600;color:#555;max-width:320px}
    .field input{display:block;width:100%;margin-top:6px;padding:12px 14px;border:1px solid #ddd;border-radius:6px;font-size:14px}
    .badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700}
  </style>
</head>
<body>
  <div data-component="navbar" data-active="home"></div>
  <main class="demo">
    <p class="eyebrow">STYLE GUIDE</p>
    <h1 style="font:800 38px 'Manrope';letter-spacing:-1.5px;margin:0">Komponen bersama</h1>

    <h2>Warna</h2>
    <div class="row">
      <div class="swatch" style="background:#111;color:#fff">#111</div>
      <div class="swatch" style="background:#333;color:#fff">#333</div>
      <div class="swatch" style="background:#777;color:#fff">#777</div>
      <div class="swatch" style="background:#dedede">#dedede</div>
      <div class="swatch" style="background:#f5f5f5">#f5f5f5</div>
    </div>

    <h2>Tombol</h2>
    <div class="row">
      <button class="button button-dark">Utama</button>
      <button class="button button-outline">Sekunder</button>
      <button class="button button-dark button-small">Kecil</button>
    </div>

    <h2>Input form</h2>
    <label class="field">Nama barang<input placeholder="Contoh: Laptop"></label>

    <h2>Chip</h2>
    <div class="category-list"><button class="category-chip selected">Semua</button><button class="category-chip">Buku</button></div>

    <h2>Badge status</h2>
    <div class="row">
      <span class="badge" style="background:#fff4d6;color:#946200">Pending</span>
      <span class="badge" style="background:#e8f5ec;color:#1f7a3d">Listed</span>
      <span class="badge" style="background:#fdecea;color:#b3261e">Rejected</span>
      <span class="badge" style="background:#111;color:#fff">Sold</span>
      <span class="badge" style="background:#eee;color:#777">Deleted</span>
    </div>

    <h2>Kartu produk</h2>
    <div class="product-grid" style="max-width:640px;grid-template-columns:repeat(2,1fr)">
      <article class="product-card">
        <div class="product-visual"><span>BUKU</span></div>
        <div class="product-info"><p class="product-category">Buku</p><h3>Paket Buku Pemrograman</h3><p class="product-condition">Sangat baik · Depok</p><div class="product-bottom"><strong>Rp85.000</strong><a href="#">Lihat</a></div></div>
      </article>
    </div>
  </main>
  <div data-component="footer"></div>
  <script src="components.js"></script>
</body>
</html>
